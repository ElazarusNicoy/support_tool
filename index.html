<!DOCTYPE html>

    <body class="home-page">

            <!-- Sidebar navigation -->
             <nav class="sidebar-nav">
                <!--Category: HR Filing-->
                <div class="nav-category">

                        <span class="category-icon">📁</span>

                        <span class="arrow">▸</span>
                    </button>
                    <div class="submenu">
                        <a href="#" class="submenu-item" onclick="openTab(event, 'Salary Complaint')">Salary Complaint</a>
                        <!--add more items here-->
                    </div>
                </div>
                <div class="nav-category">
                    <button class="category-btn" onclick="toggleCategory(this)">
                        <span class="category-icon">📁</span>
                        <span class="category-label">Quality Assurance</span>

                    </button>
                    <div class="submenu">
                        <a href="#" class="submenu-item" onclick="openTab(event, 'PDA Ticket')">PDA Ticket</a>

                    <div class="submenu">
                        <a href="#" class="submenu-item" onclick="openTab(event, 'Item Parameter Control Form')">Item Parameter Control Form</a>
                        <a href="#" class="submenu-item" onclick="openTab(event, 'WO Endorsement Form')">WO Endorsement Form</a>
                        <!--add more items here-->
                    </div>
                </div>
                <!--add more categories here-->
             </nav>
        </aside>

        <div class="main">
            <!--Tab bar-->
            <div class="tab-bar" id="tabBar"></div>
            <main class="content" id="mainContent">
                <div class="welcome-view" id="welcomeView">
                    <h1>Support Tool</h1>
                <p>Designed to eliminate knowledge silos and single-point-of-failure downtime in legacy SharePoint 2010 environments. </p>
                </div>
                <!--Tab panels will be added here by Javascript-->
                
            </main>

    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
